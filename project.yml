name: Calculator
options:
  bundleIdPrefix: com.hicham.calculator
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  Calculator:
    type: application
    platform: iOS
    sources:
      - path: Calculator
    info:
      path: Calculator/Info.plist
      properties:
        CFBundleDisplayName: Calculatrice
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hicham.calculator
        PRODUCT_NAME: Calculatrice
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
schemes:
  Calculator:
    build:
      targets:
        Calculator: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
